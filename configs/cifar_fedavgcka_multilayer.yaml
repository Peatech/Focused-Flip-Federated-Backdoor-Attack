task: CifarFed
synthesizer: Pattern

batch_size: 32
test_batch_size: 100
lr: 0.001
momentum: 0.9
decay: 0.0001
optimizer: SGD

pretrained: False

model_similarity_factor: 0.0

poisoning_proportion: 0.5
backdoor_label: 8

loss_balance: fixed
mgda_normalize: none

save_model: True
norm_clip_factor: 13

loss_tasks:
  - backdoor
  - normal

# FedAvgCKA Multi-Layer Defense Configuration
defence: fedavg
fedavgcka_enabled: false
fedavgcka_root_dataset_size: 64
fedavgcka_root_dataset_strategy: "class_balanced"
fedavgcka_layer_comparison: "multi_layer"  # Enable multi-layer mode
fedavgcka_trim_fraction: 0.5
fedavgcka_log_scores: true

# Multi-layer weights (can be customized)
fedavgcka_multi_layer_weights:
  penultimate: 0.6  # 50% weight to penultimate layer
  layer3: 0.3       # 30% weight to layer3
  layer2: 0.1       # 20% weight to layer2

