task: Cifar10
synthesizer: Pattern

batch_size: 64
test_batch_size: 100
lr: 0.001
momentum: 0.9
decay: 0.0005
epochs: 10
save_on_epochs: []
optimizer: Adam
log_interval: 100

pretrained: True

scheduler: True
scheduler_milestones: [30, 60]

poisoning_proportion: 1.1
backdoor_label: 8
backdoor: False

loss_balance: MGDA
mgda_normalize: loss+

save_model: False
log: False
tb: False

transform_train: True

# FedAvgCKA Defense Configuration
defence: fedavgcka
fedavgcka_enabled: true
fedavgcka_root_dataset_size: 64
fedavgcka_root_dataset_strategy: "class_balanced"
fedavgcka_layer_comparison: "penultimate"
fedavgcka_trim_fraction: 0.3
fedavgcka_log_scores: true

# Federated Learning Parameters
n_clients: 10
n_malicious_client: 2
chosen_rate: 0.5
local_epoch: 2
n_epochs: 10

loss_tasks:
  - backdoor
  - normal
