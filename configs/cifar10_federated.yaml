# CIFAR-10 Federated Learning Configuration with FedAvgCKA Multi-Layer Defense
# This is the comprehensive config file for CIFAR-10 federated learning experiments

# =============================================================================
# TASK CONFIGURATION
# =============================================================================
task: CifarFed  # Use CifarFed for federated learning (not Cifar10 for centralized)
synthesizer: Pattern

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
batch_size: 32
test_batch_size: 100
lr: 0.001
momentum: 0.9
decay: 0.0001
optimizer: SGD
pretrained: False

# =============================================================================
# FEDERATED LEARNING PARAMETERS
# =============================================================================
# These are the key FL parameters that control the federated learning setup
fl: true
fl_no_models: 20              # Number of clients participating
fl_local_epochs: 2            # Local training epochs per round
fl_total_participants: 100    # Total number of potential participants
fl_eta: 10                    # Number of clients selected per round
fl_sample_dirichlet: False    # Use Dirichlet distribution for client selection
fl_dirichlet_alpha: None      # Dirichlet alpha parameter
fl_diff_privacy: False        # Differential privacy
fl_dp_clip: None              # DP clipping parameter
fl_dp_noise: None             # DP noise parameter
fl_number_of_adversaries: 4   # Number of malicious clients
fl_weight_scale: 100          # Weight scaling factor
fl_single_epoch_attack: 1     # Single epoch attack parameter

# =============================================================================
# ATTACK CONFIGURATION
# =============================================================================
poisoning_proportion: 0.5     # Proportion of poisoned data
backdoor_label: 8             # Target label for backdoor attack
model_similarity_factor: 0.0  # Model similarity factor
loss_balance: fixed           # Loss balancing strategy
mgda_normalize: none          # MGDA normalization

# =============================================================================
# FEDAVGCKA MULTI-LAYER DEFENSE CONFIGURATION
# =============================================================================
defence: fedavgcka            # Enable FedAvgCKA defense
fedavgcka_enabled: true       # Explicitly enable FedAvgCKA
fedavgcka_root_dataset_size: 64
fedavgcka_root_dataset_strategy: "class_balanced"
fedavgcka_layer_comparison: "multi_layer"  # Enable multi-layer mode
fedavgcka_trim_fraction: 0.5  # Exclude 50% of clients with lowest CKA scores
fedavgcka_log_scores: true    # Enable detailed logging

# Multi-layer weights configuration
fedavgcka_multi_layer_weights:
  penultimate: 0.6  # 60% weight to penultimate layer (avgpool)
  layer3: 0.3       # 30% weight to layer3
  layer2: 0.1       # 10% weight to layer2

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================
save_model: True
norm_clip_factor: 13
log_interval: 100

# Loss tasks for multi-task learning
loss_tasks:
  - backdoor
  - normal

